<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logos/Bright%20Cyan%20MKCA%20Logo%20Letters.png" />
    <title>Payment Update</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #e0f2fe);
        color: #0f172a;
      }
      .card {
        max-width: 540px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        padding: 32px 28px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        padding: 10px 16px;
        border-radius: 999px;
        background: #e0f2fe;
        color: #075985;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 12px;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 2.7rem);
        margin: 18px 0 12px;
      }
      p {
        line-height: 1.6;
        color: #475569;
        margin: 0 0 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Payment update</div>
      <h1>Payment is being confirmed.</h1>
      <p>
        Your payment has been submitted and is being validated. A confirmation will be sent to
        your email and phone once the transaction is confirmed.
      </p>
    </div>
  </body>
</html>
