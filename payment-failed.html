<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/logos/Bright%20Cyan%20MKCA%20Logo%20Letters.png" />
  <title>Payment Unsuccessful | MKCA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 text-slate-900">
  <main class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="max-w-2xl w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 md:p-12 text-center">
      <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-rose-100 text-4xl text-rose-700">!</div>
      <p class="text-xs uppercase tracking-[0.3em] text-rose-700 mb-4">Payment not completed</p>
      <h1 class="text-4xl font-bold text-slate-900 mb-4">We couldn't confirm your payment.</h1>
      <p class="text-lg text-slate-600 mb-8">No successful payment was confirmed. Please try again or contact MKCA support if the amount was deducted.</p>
      <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/insurance/payment" class="inline-flex items-center justify-center rounded-xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white hover:bg-sky-700">Try Again</a>
        <a href="/contact" class="inline-flex items-center justify-center rounded-xl border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100">Contact Support</a>
      </div>
    </div>
  </main>
</body>
</html>
